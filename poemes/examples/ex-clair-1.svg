<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" font-family="'Cormorant Garamond', 'Georgia', serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F1E8"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#3A3A3A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3A3A3A" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8935A" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#B8935A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8935A" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="500" height="700" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="500" height="700" fill="url(#vignette)"/>

  <!-- Cadre doré fin -->
  <rect x="28" y="28" width="444" height="644" fill="none" stroke="#B8935A" stroke-width="1" stroke-opacity="0.85"/>

  <!-- Ornements de coin (fleuron simple, branche fine) -->
  <g stroke="#B8935A" stroke-width="1" fill="none" stroke-opacity="0.8">
    <!-- coin haut-gauche -->
    <path d="M 28 60 Q 45 60 45 43 Q 45 60 62 60" />
    <path d="M 28 43 Q 45 43 45 60" stroke-opacity="0.5"/>
    <!-- coin haut-droit -->
    <path d="M 472 60 Q 455 60 455 43 Q 455 60 438 60" />
    <!-- coin bas-gauche -->
    <path d="M 28 640 Q 45 640 45 657 Q 45 640 62 640" />
    <!-- coin bas-droit -->
    <path d="M 472 640 Q 455 640 455 657 Q 455 640 438 640" />
  </g>

  <!-- Motif catégorie : deux anneaux entrelacés (mariage), sous le cadre supérieur -->
  <g transform="translate(250,90)" stroke="#B8935A" stroke-width="1.4" fill="none" stroke-opacity="0.9">
    <circle cx="-8" cy="0" r="11"/>
    <circle cx="8" cy="0" r="11"/>
  </g>

  <!-- Titre du poème -->
  <text x="250" y="145" text-anchor="middle" font-size="24" letter-spacing="3" fill="#1A1A1A" font-weight="500">
    TITRE DU POÈME
  </text>

  <!-- Séparateur avec motif central -->
  <g transform="translate(250,168)">
    <line x1="-90" y1="0" x2="-14" y2="0" stroke="url(#goldLine)" stroke-width="1"/>
    <line x1="14" y1="0" x2="90" y2="0" stroke="url(#goldLine)" stroke-width="1"/>
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" fill="#B8935A"/>
  </g>

  <!-- Lettrine -->
  <text x="55" y="255" font-size="64" fill="#B8935A" font-weight="500">L</text>

  <!-- Zone de texte du poème (flexible en hauteur, remplie dynamiquement par le code) -->
  <foreignObject x="90" y="205" width="360" height="380">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; line-height: 1.75; color: #3A3A3A; text-align: left;">
      Corps du poème inséré ici dynamiquement — cette zone est prévue en hauteur flexible pour absorber les poèmes courts comme longs sans casser la mise en page.
    </div>
  </foreignObject>

  <!-- Prénom du destinataire -->
  <text x="250" y="612" text-anchor="middle" font-size="17" letter-spacing="2" fill="#B8935A" font-style="italic">
    Pour Prénom
  </text>

  <!-- Séparateur bas -->
  <g transform="translate(250,632)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#B8935A" stroke-width="0.6" stroke-opacity="0.6"/>
  </g>

  <!-- Signature -->
  <text x="250" y="662" text-anchor="middle" font-size="13" letter-spacing="3" fill="#B8935A" fill-opacity="0.85">
    ALEX HARPER
  </text>
</svg>
