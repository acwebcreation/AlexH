<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" font-family="'Cormorant Garamond', 'Georgia', serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FBF1EF"/>
      <stop offset="100%" stop-color="#F3E1DD"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#8A5A54" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8A5A54" stop-opacity="0.07"/>
    </radialGradient>
    <linearGradient id="roseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C98A85" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#C98A85" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C98A85" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="700" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="500" height="700" fill="url(#vignette)"/>

  <rect x="28" y="28" width="444" height="644" fill="none" stroke="#C98A85" stroke-width="1" stroke-opacity="0.8"/>

  <g stroke="#C98A85" stroke-width="1" fill="none" stroke-opacity="0.75">
    <path d="M 28 60 Q 45 60 45 43 Q 45 60 62 60" />
    <path d="M 28 43 Q 45 43 45 60" stroke-opacity="0.5"/>
    <path d="M 472 60 Q 455 60 455 43 Q 455 60 438 60" />
    <path d="M 28 640 Q 45 640 45 657 Q 45 640 62 640" />
    <path d="M 472 640 Q 455 640 455 657 Q 455 640 438 640" />
  </g>

  <!-- Motif catégorie : cœur simple (amour) -->
  <g transform="translate(250,92)" stroke="#C98A85" stroke-width="1.3" fill="none" stroke-opacity="0.9">
    <path d="M 0 10 C -14 -2 -14 -14 -4 -14 C 0 -14 0 -10 0 -8 C 0 -10 0 -14 4 -14 C 14 -14 14 -2 0 10 Z"/>
  </g>

  <text x="250" y="150" text-anchor="middle" font-size="24" letter-spacing="3" fill="#4A2E2B" font-weight="500">
    TITRE DU POÈME
  </text>

  <g transform="translate(250,173)">
    <line x1="-90" y1="0" x2="-14" y2="0" stroke="url(#roseLine)" stroke-width="1"/>
    <line x1="14" y1="0" x2="90" y2="0" stroke="url(#roseLine)" stroke-width="1"/>
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" fill="#C98A85"/>
  </g>

  <text x="55" y="258" font-size="64" fill="#C98A85" font-weight="500">L</text>

  <foreignObject x="90" y="208" width="360" height="380">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; line-height: 1.75; color: #5C4642; text-align: left;">
      Corps du poème inséré ici dynamiquement — thème pastel, teinte rose poudré.
    </div>
  </foreignObject>

  <text x="250" y="612" text-anchor="middle" font-size="17" letter-spacing="2" fill="#C98A85" font-style="italic">
    Pour Prénom
  </text>

  <g transform="translate(250,632)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#C98A85" stroke-width="0.6" stroke-opacity="0.6"/>
  </g>

  <text x="250" y="662" text-anchor="middle" font-size="13" letter-spacing="3" fill="#C98A85" fill-opacity="0.9">
    ALEX HARPER
  </text>
</svg>
