<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" font-family="'Cormorant Garamond', 'Georgia', serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c8a96e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="700" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="500" height="700" fill="url(#vignette)"/>

  <rect x="28" y="28" width="444" height="644" fill="none" stroke="#c8a96e" stroke-width="1" stroke-opacity="0.85"/>

  <g stroke="#c8a96e" stroke-width="1" fill="none" stroke-opacity="0.8">
    <path d="M 28 60 Q 45 60 45 43 Q 45 60 62 60" />
    <path d="M 28 43 Q 45 43 45 60" stroke-opacity="0.5"/>
    <path d="M 472 60 Q 455 60 455 43 Q 455 60 438 60" />
    <path d="M 28 640 Q 45 640 45 657 Q 45 640 62 640" />
    <path d="M 472 640 Q 455 640 455 657 Q 455 640 438 640" />
  </g>

  <g transform="translate(250,90)" stroke="#c8a96e" stroke-width="1.3" fill="none" stroke-opacity="0.9">
    <path d="M -14 0 C -14 -8 -4 -8 0 0 C 4 8 14 8 14 0 C 14 -8 4 -8 0 0 C -4 8 -14 8 -14 0 Z"/>
  </g>

  <text x="250" y="150" text-anchor="middle" font-size="24" letter-spacing="3" fill="#f4ead9" font-weight="500">
    TITRE DU POÈME
  </text>

  <g transform="translate(250,173)">
    <line x1="-90" y1="0" x2="-14" y2="0" stroke="url(#goldLine)" stroke-width="1"/>
    <line x1="14" y1="0" x2="90" y2="0" stroke="url(#goldLine)" stroke-width="1"/>
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" fill="#c8a96e"/>
  </g>

  <text x="55" y="258" font-size="64" fill="#c8a96e" font-weight="500">L</text>

  <foreignObject x="90" y="208" width="360" height="380">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; line-height: 1.75; color: #ece4d6; text-align: left;">
      Corps du poème inséré ici dynamiquement — cette zone est prévue en hauteur flexible pour absorber les poèmes courts comme longs sans casser la mise en page.
    </div>
  </foreignObject>

  <text x="250" y="612" text-anchor="middle" font-size="17" letter-spacing="2" fill="#c8a96e" font-style="italic">
    Ensemble depuis toujours
  </text>

  <g transform="translate(250,632)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#c8a96e" stroke-width="0.6" stroke-opacity="0.6"/>
  </g>

  <text x="250" y="662" text-anchor="middle" font-size="13" letter-spacing="3" fill="#c8a96e" fill-opacity="0.85">
    ALEX HARPER
  </text>
</svg>
