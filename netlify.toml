[build]
  publish = "."

# Anciennes pages supprimées : on renvoie les visiteurs vers les bonnes pages
[[redirects]]
  from = "/poemes/*"
  to = "/chansons.html"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/article-*"
  to = "/"
  status = 301
